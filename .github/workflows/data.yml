name: Actualizar históricos macro
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yfinance
      - run: python update_data.py
      - run: |
          git config user.name macro-monitor-bot
          git config user.email macro-monitor-bot@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m 'Actualizar históricos' && git push)
